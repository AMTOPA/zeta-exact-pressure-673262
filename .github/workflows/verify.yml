name: verify

on:
  push:
  pull_request:

jobs:
  arithmetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check exact multiplicity identity
        run: python src/check_multiplicity.py
      - name: Check final interval bound
        run: python src/check_final_bound.py
