name: build-paper

on:
  workflow_dispatch:
  push:
    paths:
      - "paper/main.tex"
      - ".github/workflows/build-paper.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper

      - name: Commit compiled PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.pdf
          if git diff --cached --quiet; then
            echo "PDF is already up to date."
          else
            git commit -m "Build proof PDF from LaTeX source"
            git push
          fi
